services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ:-Asia/Bahrain}
      PORT: 5055
      LOG_LEVEL: info
    volumes:
      - ${APPDATA_ROOT:-/mnt/user/appdata}/seerr:/app/config
    ports:
      - "${SEERR_PORT:-5055}:5055"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Bahrain}
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    volumes:
      - ${APPDATA_ROOT:-/mnt/user/appdata}/plex:/config
      - ${DATA_ROOT:-/mnt/user/data}:/data
    ports:
      - "${PLEX_PORT:-32400}:32400/tcp"
      - "1900:1900/udp"
      - "3005:3005/tcp"
      - "5353:5353/udp"
      - "8324:8324/tcp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
      - "32469:32469/tcp"
    # Optional Intel/AMD hardware transcoding on supported Linux hosts:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Bahrain}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${APPDATA_ROOT:-/mnt/user/appdata}/qbittorrent:/config
      - ${DATA_ROOT:-/mnt/user/data}:/data
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-8080}:8080/tcp"
      - "${QBITTORRENT_TORRENT_PORT:-6881}:6881/tcp"
      - "${QBITTORRENT_TORRENT_PORT:-6881}:6881/udp"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Bahrain}
    volumes:
      - ${APPDATA_ROOT:-/mnt/user/appdata}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Bahrain}
    volumes:
      - ${APPDATA_ROOT:-/mnt/user/appdata}/sonarr:/config
      - ${DATA_ROOT:-/mnt/user/data}:/data
    ports:
      - "${SONARR_PORT:-8989}:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Bahrain}
    volumes:
      - ${APPDATA_ROOT:-/mnt/user/appdata}/radarr:/config
      - ${DATA_ROOT:-/mnt/user/data}:/data
    ports:
      - "${RADARR_PORT:-7878}:7878"
    restart: unless-stopped
